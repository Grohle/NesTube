<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NesTube</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="nesting">
<!--ICONS-->
<div class="app">
  <!-- ═══════════════════════ TOP BAR ═══════════════════════ -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="brand-btn" id="brand-btn" data-menu aria-haspopup="menu" aria-expanded="false" title="Menú principal: Archivo, Vista, Configuración, Acerca de, Ayuda">
        <span class="brand-mark">N</span><svg class="icon sm caret"><use href="#i-chevron-down"/></svg>
      </button>
      <span class="vsep"></span>
      <nav class="workspace-tabs" role="tablist" aria-label="Pestañas">
        <button role="tab" data-view="jobs" aria-selected="false" title="Explorador de Jobs"><svg class="icon"><use href="#i-folder"/></svg><span>Jobs</span></button>
        <button role="tab" data-view="cuts" aria-selected="false" title="Cortes"><svg class="icon"><use href="#i-scissors"/></svg><span>Cortes</span></button>
        <button role="tab" data-view="nesting" aria-selected="true" title="Anidado"><svg class="icon"><use href="#i-nest"/></svg><span>Anidado</span></button>
        <button role="tab" data-view="costs" aria-selected="false" title="Costes y Peso"><svg class="icon"><use href="#i-coins"/></svg><span>Costes</span></button>
        <button role="tab" data-view="profiles" aria-selected="false" title="Perfiles y Tubos"><svg class="icon"><use href="#i-beam"/></svg><span>Perfiles</span></button>
        <button role="tab" data-view="stock" aria-selected="false" title="Stock"><svg class="icon"><use href="#i-boxes"/></svg><span>Stock</span></button>
      </nav>
    </div>
    <div class="topbar-center">
      <div class="doc-title"><span>PED-2026-001</span><span>/</span><strong id="doc-material">IPE 200 · S235</strong><span class="dirty-dot" id="dirty-dot" title="Cambios sin guardar" hidden></span></div>
    </div>
    <div class="topbar-right">
      <button class="btn icon-only" title="Atajos de teclado (?)" data-act="shortcuts"><svg class="icon"><use href="#i-keyboard"/></svg></button>
      <button class="btn icon-only" id="theme-btn" title="Cambiar tema claro/oscuro"></button>
      <span class="vsep"></span>
      <button class="btn zoom-pill" id="zoom-btn" data-menu aria-haspopup="menu" aria-expanded="false" title="Zoom respecto a la vista ajustada. Clic: opciones de zoom">100%</button>
      <button class="btn outline" id="export-btn" data-menu aria-haspopup="menu" aria-expanded="false"><svg class="icon sm"><use href="#i-export"/></svg>Exportar<svg class="icon sm caret"><use href="#i-chevron-down"/></svg></button>
      <div class="split">
        <button class="btn primary" id="auto-nest-btn" data-act="auto-nest" title="Iniciar anidado automático: coloca todas las piezas pendientes según la estrategia seleccionada"><svg class="icon sm"><use href="#i-gear"/></svg>Auto-anidar</button>
        <button class="btn primary" id="auto-nest-mode" data-menu aria-haspopup="menu" aria-expanded="false" title="Modo: Todo / Solo pendientes"><svg class="icon sm"><use href="#i-chevron-down"/></svg></button>
      </div>
    </div>
  </header>

  <main class="workspace">
